name: StockPhotoScout CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/StockPhotoScout.Tests/StockPhotoScout.Tests.csproj

      - name: Build application
        run: dotnet build src/StockPhotoScout/StockPhotoScout.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/StockPhotoScout.Tests/StockPhotoScout.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
